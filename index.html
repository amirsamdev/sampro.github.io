<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#222222">

    <title>Swift Status | وضعیت بازی‌ها</title>

    <style>
        :root {
            --bg: #222222;
            --card: #2B2B2B;
            --primary: #2E4192;
            --accent: #4E6FF8;
            --light: #9AABFF;

            --text: #FFFFFF;
            --muted: #B8B8B8;

            --border: rgba(154, 171, 255, 0.20);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(
                    circle at 85% 0%,
                    rgba(78, 111, 248, 0.16),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);
            min-height: 100vh;
        }

        .container {
            width: min(1150px, 100%);
            margin: auto;
            padding: 28px 20px;
        }

        /* Header */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                var(--accent),
                var(--primary)
            );

            color: white;
            font-size: 28px;
            font-weight: bold;

            box-shadow: 0 0 25px rgba(78, 111, 248, 0.25);
        }

        .brand h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .brand p {
            font-size: 13px;
            color: var(--muted);
        }

        .counter {
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--card);
            color: var(--light);

            font-size: 13px;
            white-space: nowrap;
        }

        /* Search */

        .search-box {
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            padding: 16px;

            border: 1px solid var(--border);
            border-radius: 14px;

            background: var(--card);
            color: white;

            font-size: 14px;
            font-family: inherit;

            outline: none;
            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(78, 111, 248, 0.12);
        }

        .search-box input::placeholder {
            color: #999999;
        }

        /* Games Grid */

        .games-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
        }

        /* Game Card */

        .game-card {
            min-width: 0;

            padding: 18px;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 17px;

            transition:
                transform 0.2s,
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .game-card:hover {
            transform: translateY(-4px);

            border-color: var(--accent);

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .game-top {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        /* Game Icon */

        .game-icon {
            width: 52px;
            height: 52px;

            flex-shrink: 0;

            border-radius: 14px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: var(--primary);
            border: 1px solid rgba(154, 171, 255, 0.25);

            color: white;
            font-size: 20px;
            font-weight: bold;

            overflow: hidden;
        }

        .game-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            min-width: 0;
        }

        .game-name {
            font-size: 15px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .package-name {
            margin-top: 5px;

            font-size: 10px;
            color: #A9A9A9;

            direction: ltr;
            text-align: right;
            overflow-wrap: anywhere;
        }

        /* Status */

        .game-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;

            margin-top: 20px;
            padding-top: 14px;

            border-top: 1px solid var(--border);
        }

        .status-label {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 13px;
            font-weight: bold;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;
            flex-shrink: 0;
        }

        .active .status-label {
            color: var(--light);
        }

        .active .status-dot {
            background: var(--accent);
            box-shadow: 0 0 10px rgba(78, 111, 248, 0.7);
        }

        .inactive .status-label {
            color: #AAAAAA;
        }

        .inactive .status-dot {
            background: #777777;
        }

        .status-badge {
            padding: 7px 10px;

            border-radius: 8px;

            background: rgba(78, 111, 248, 0.13);
            border: 1px solid rgba(78, 111, 248, 0.3);

            color: var(--light);
            font-size: 11px;
            font-weight: bold;
        }

        .inactive .status-badge {
            background: rgba(150, 150, 150, 0.08);
            border-color: rgba(180, 180, 180, 0.2);
            color: #AAAAAA;
        }

        .empty-message {
            grid-column: 1 / -1;
            padding: 35px;
            text-align: center;

            background: var(--card);
            border-radius: 14px;

            color: var(--muted);
        }

        /* Footer */

        .footer {
            margin-top: 35px;
            padding-top: 20px;

            border-top: 1px solid var(--border);

            text-align: center;
            color: #999999;

            font-size: 12px;
            line-height: 2;
        }

        /* Responsive */

        @media (max-width: 950px) {
            .games-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 650px) {
            .container {
                padding: 20px 13px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .brand h1 {
                font-size: 21px;
            }

            .brand-icon {
                width: 52px;
                height: 52px;
            }

            .games-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .game-card {
                padding: 12px;
                border-radius: 14px;
            }

            .game-icon {
                width: 42px;
                height: 42px;
                border-radius: 11px;
            }

            .game-name {
                font-size: 12px;
            }

            .package-name {
                font-size: 9px;
            }

            .status-label {
                font-size: 11px;
            }

            .status-badge {
                padding: 6px 8px;
                font-size: 10px;
            }
        }

        @media (max-width: 360px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="brand">

            <div class="brand-icon">
                G
            </div>

            <div>
                <h1>Game Center</h1>

                <p>
                    مرکز نمایش وضعیت بازی‌ها
                </p>
            </div>

        </div>

        <div class="counter" id="counter">
            در حال بارگذاری...
        </div>

    </header>


    <div class="search-box">

        <input
            type="search"
            id="search"
            placeholder="🔍 جست‌وجوی بازی..."
            aria-label="جست‌وجوی بازی"
        >

    </div>


    <section
        class="games-grid"
        id="gamesGrid"
        aria-label="فهرست بازی‌ها"
    ></section>


    <footer class="footer">

        Swiftdns © 2026

        <br>

        طراحی شده با رابط کاربری اختصاصی

    </footer>

</div>


<script>

/*
====================================================
          تنظیمات مدیر سایت
====================================================

وضعیت بازی‌ها را فقط از همین قسمت تغییر بده.

active   = فعال
inactive = غیرفعال

برای افزودن آیکون:
icon: "icons/pubg.png"

اگر آیکون نداری، مقدار icon را خالی بگذار.

بعد از تغییر، فایل را ذخیره و دوباره روی هاست
بارگذاری کن.
====================================================
*/


const GAME_LIST = [

    {
        name: "PUBG Mobile",
        package: "com.tencent.ig",
        status: "active",
        icon: "https://myket.ir/app-icon/ff27e582-ce9d-43c9-9c6b-9b1ae0c80591.png"
    },

    {
        name: "Call of Duty Mobile",
        package: "com.activision.callofduty.shooter",
        status: "active",
        icon: "https://myket.ir/app-icon/com.activision.callofduty.shooter_6fe5fa2c-d1a5-4046-a43a-0cd6aa546fd6.png"
    },

    {
        name: "Mobile Legends",
        package: "com.mobile.legends",
        status: "active",
        icon: "https://myket.ir/app-icon/com.mobile.legends_2ff071b3-898b-4c71-b158-40f51313de4f.png"
    },

    {
        name: "Brawl Stars",
        package: "com.supercell.brawlstars",
        status: "active",
        icon: "https://myket.ir/app-icon/com.supercell.brawlstars_09f41ad3-4a60-4e88-a336-a074e522e8f7.png"
    },

    {
        name: "Clash Royale",
        package: "com.supercell.clashroyale",
        status: "active",
        icon: "https://myket.ir/app-icon/com.supercell.clashroyale_9c654fe3-7ff3-4811-8306-508f8d2977bf.png"
    },

    {
        name: "Clash of Clans",
        package: "com.supercell.clashofclans",
        status: "active",
        icon: "https://myket.ir/app-icon/com.supercell.clashofclans_cd4a957f-b1db-46d5-ae53-5651898a82a2.png"
    },

    {
        name: "Free Fire",
        package: "com.dts.freefire",
        status: "active",
        icon: "https://myket.ir/app-icon/com.dts.freefireth_e081af90-654c-425d-9e7e-6297363ebefd.png"
    },

    {
        name: "Delta Force",
        package: "com.proxima.dfm",
        status: "active",
        icon: "https://myket.ir/app-icon/com.proxima.dfm_5ae8ae71-8c12-4f8b-bb44-e9bba941f987.png"
    },

    {
        name: "Standoff 2",
        package: "com.axlebolt.standoff2",
        status: "active",
        icon: "https://myket.ir/app-icon/fdb1089c-c72f-474a-b7c1-6382b3ec36c8.png"
    },

    {
        name: "Arena Breakout",
        package: "com.proximabeta.mf.uamo",
        status: "active",
        icon: "https://myket.ir/app-icon/com.proximabeta.mf.uamo_5cd3385c-f880-4338-a74f-ef5d6bb9411c.png"
    },

    {
        name: "Blood Strike",
        package: "com.netease.newspike",
        status: "active",
        icon: "https://myket.ir/app-icon/com.netease.newspike_bfa9d9f0-7744-4ac0-b010-2ecf57c23ce2.png"
    },

    {
        name: "eFootball",
        package: "jp.konami.pesam",
        status: "active",
        icon: "https://myket.ir/app-icon/jp.konami.pesam_33be1c56-7eb8-4637-9cea-267c5e138df0.png"
    },

    {
        name: "FC",
        package: "com.ea.gp.fifamobile",
        status: "active",
        icon: "https://myket.ir/app-icon/com.ea.gp.fifamobile_00caddbd-ef7a-49a2-a34a-b869aa969761.png"
    },

    {
        name: "Roblox",
        package: "com.roblox.client",
        status: "active",
        icon: "https://myket.ir/app-icon/com.roblox.client_19bdcec9-189d-4e5c-ab9c-35011444949d.png"
    },

    {
        name: "LOL",
        package: "com.riotgames.league.wildrift",
        status: "active",
        icon: "https://myket.ir/app-icon/com.riotgames.league.wildrift_fdef8f50-ef76-451d-8d30-f2544e791908.png"
    },

    {
        name: "Minecraft",
        package: "com.mojang.minecraftpe",
        status: "active",
        icon: "https://myket.ir/app-icon/5588bf77-7d4a-4d78-a905-2d59d48d5ca1.png"
    }

];


/* نمایش بازی‌ها */

const gamesGrid = document.getElementById("gamesGrid");
const searchInput = document.getElementById("search");
const counter = document.getElementById("counter");


function renderGames() {

    const query = searchInput.value
        .trim()
        .toLowerCase();

    const filteredGames = GAME_LIST.filter(game => {

        return (
            game.name.toLowerCase().includes(query) ||
            game.package.toLowerCase().includes(query)
        );

    });

    gamesGrid.innerHTML = "";


    if (filteredGames.length === 0) {

        const message = document.createElement("div");

        message.className = "empty-message";

        message.textContent = "بازی موردنظر پیدا نشد.";

        gamesGrid.appendChild(message);

    }


    filteredGames.forEach(game => {

        const isActive = game.status === "active";


        const card = document.createElement("article");

        card.className =
            "game-card " +
            (isActive ? "active" : "inactive");


        /* اطلاعات بازی */

        const top = document.createElement("div");

        top.className = "game-top";


        /* آیکون بازی */

        const iconBox = document.createElement("div");

        iconBox.className = "game-icon";


        if (game.icon) {

            const image = document.createElement("img");

            image.src = game.icon;

            image.alt = "آیکون " + game.name;

            image.onerror = function () {

                iconBox.textContent = game.name.charAt(0);

            };

            iconBox.appendChild(image);

        } else {

            iconBox.textContent = game.name.charAt(0);

        }


        /* نام و پکیج */

        const info = document.createElement("div");

        info.className = "game-info";


        const name = document.createElement("h2");

        name.className = "game-name";

        name.textContent = game.name;


        const packageName = document.createElement("p");

        packageName.className = "package-name";

        packageName.textContent = game.package;


        info.appendChild(name);

        info.appendChild(packageName);


        top.appendChild(iconBox);

        top.appendChild(info);


        /* وضعیت بازی */

        const status = document.createElement("div");

        status.className = "game-status";


        const label = document.createElement("div");

        label.className = "status-label";


        const dot = document.createElement("span");

        dot.className = "status-dot";


        const labelText = document.createElement("span");

        labelText.textContent = isActive
            ? "فعال"
            : "غیرفعال";


        label.appendChild(dot);

        label.appendChild(labelText);


        const badge = document.createElement("span");

        badge.className = "status-badge";

        badge.textContent = isActive
            ? "ACTIVE"
            : "INACTIVE";


        status.appendChild(label);

        status.appendChild(badge);


        card.appendChild(top);

        card.appendChild(status);


        gamesGrid.appendChild(card);

    });


    /* شمارنده */

    const activeCount = GAME_LIST.filter(
        game => game.status === "active"
    ).length;


    counter.textContent =
        activeCount +
        " از " +
        GAME_LIST.length +
        " بازی فعال";

}


/* جست‌وجو */

searchInput.addEventListener(
    "input",
    renderGames
);


/* اجرای اولیه */

renderGames();

</script>

</body>
</html>
