<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>GAMEHUB | گیم‌هاب</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #222222;
            --bg-soft: #2b2b2b;
            --blue-dark: #2E4192;
            --blue: #4E6FF8;
            --blue-soft: #9aabff;
            --white: #ffffff;
            --text: #eeeeee;
            --muted: #a5a5a5;
            --border: rgba(255,255,255,.08);
            --card: #2b2b2b;
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: "Vazirmatn", sans-serif;
            background: linear-gradient(
                to bottom,
                #222222 0%,
                #2b2b2b 35%,
                #2E4192 100%
            );
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.8;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            width: min(1180px, calc(100% - 32px));
            margin-inline: auto;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(34,34,34,.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: var(--white);
            white-space: nowrap;
        }

        .logo span,
        .footer-logo span {
            color: var(--blue);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: #d6d6d6;
            font-size: 14px;
            font-weight: 500;
        }

        nav a.active,
        nav a:hover {
            color: var(--blue);
        }

        .mobile-menu {
            display: none;
            border: 1px solid var(--border);
            background: var(--bg-soft);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
        }

        /* =========================
           HERO SLIDER
        ========================= */

        .hero {
            margin-top: 28px;
        }

        .slider {
            position: relative;
            width: 100%;
            min-height: 390px;
            height: clamp(360px, 42vw, 500px);
            overflow: hidden;
            border-radius: 26px;
            border: 1px solid var(--border);
            background: #2b2b2b;
            isolation: isolate;
            touch-action: pan-y;
        }

        /*
            مهم:
            اسلایدها دیگر absolute نیستند.
            با transform جابه‌جا می‌شوند تا روی
            Android و حالت Portrait پایدار باشند.
        */

        .slides {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 100%;
            display: flex;
            direction: ltr;
            will-change: transform;
            transition: transform .45s cubic-bezier(.22,.61,.36,1);
        }

        .slides.dragging {
            transition: none;
        }

        .slide {
            position: relative;
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            min-width: 100%;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            overflow: hidden;
            direction: rtl;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .slide-image {
            height: 100%;
            min-height: 390px;
            overflow: hidden;
        }

        .slide-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
        }

        .slide-content {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 38px;
            background: linear-gradient(
                135deg,
                #222222,
                #2b2b2b 55%,
                #2E4192
            );
        }

        .slide-category {
            width: fit-content;
            background: rgba(78,111,248,.18);
            color: var(--blue-soft);
            border: 1px solid rgba(78,111,248,.35);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .slide-content h1 {
            font-size: clamp(24px, 3vw, 38px);
            line-height: 1.4;
            margin-bottom: 13px;
            color: white;
            overflow-wrap: anywhere;
        }

        .slide-content p {
            color: #c3c3c3;
            font-size: 14px;
            max-width: 560px;
            margin-bottom: 18px;
            overflow-wrap: anywhere;
        }

        .slide-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 15px;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 20px;
        }

        .continue-btn {
            width: fit-content;
            background: var(--blue);
            color: white;
            padding: 9px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .slider-controls {
            position: absolute;
            left: 25px;
            bottom: 18px;
            display: flex;
            gap: 7px;
            z-index: 20;
            direction: ltr;
        }

        .slider-dot {
            width: 8px;
            height: 8px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: rgba(255,255,255,.35);
            cursor: pointer;
            transition: .2s ease;
        }

        .slider-dot.active {
            width: 25px;
            border-radius: 20px;
            background: var(--blue);
        }

        /* =========================
           SECTIONS
        ========================= */

        section {
            margin-top: 45px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
        }

        .section-heading h2 {
            font-size: 22px;
            color: white;
        }

        .section-heading p {
            color: var(--muted);
            font-size: 12px;
        }

        /* =========================
           GAMES + NEWS
        ========================= */

        .game-news-layout {
            display: grid;
            grid-template-columns: 280px minmax(0,1fr);
            gap: 18px;
            align-items: stretch;
        }

        .games-panel {
            min-width: 0;
            background: linear-gradient(
                160deg,
                #222222,
                #2b2b2b 45%,
                #2E4192
            );
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
        }

        .games-panel-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            color: white;
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .game-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-width: 0;
            border: 1px solid transparent;
            background: rgba(255,255,255,.04);
            color: #d7d7d7;
            padding: 10px;
            border-radius: 14px;
            cursor: pointer;
            text-align: right;
            transition: .2s ease;
        }

        .game-item:hover,
        .game-item.active {
            background: rgba(78,111,248,.18);
        }

        .game-item.active {
            border-color: rgba(78,111,248,.45);
            color: white;
        }

        .game-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            object-fit: cover;
            flex-shrink: 0;
            background: #202020;
        }

        .game-item-name {
            font-size: 12px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .news-panel {
            min-width: 0;
            background: linear-gradient(
                145deg,
                #2b2b2b,
                #2E4192
            );
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
        }

        .news-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .news-panel-head h3 {
            color: white;
            font-size: 17px;
        }

        .selected-game-label {
            color: var(--blue-soft);
            font-size: 12px;
            font-weight: 600;
        }

        .feed {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 12px;
        }

        .feed-card {
            background: rgba(34,34,34,.72);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 15px;
            padding: 14px;
            min-width: 0;
        }

        .feed-card.event {
            border-right: 3px solid var(--blue);
        }

        .feed-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .feed-type {
            font-size: 10px;
            color: var(--blue-soft);
            background: rgba(78,111,248,.12);
            padding: 3px 8px;
            border-radius: 999px;
        }

        .feed-card.event .feed-type {
            color: white;
            background: var(--blue);
        }

        .feed-time {
            color: var(--muted);
            font-size: 10px;
        }

        .feed-card h4 {
            font-size: 13px;
            line-height: 1.7;
            color: white;
            margin-bottom: 6px;
        }

        .feed-card p {
            font-size: 11px;
            color: #aaa;
            line-height: 1.8;
        }

        .empty {
            padding: 30px 15px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           ARTICLES
        ========================= */

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 18px;
        }

        .article-card {
            overflow: hidden;
            background: linear-gradient(
                145deg,
                #222222,
                #2b2b2b
            );
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .article-image {
            height: 190px;
            overflow: hidden;
            background: #202020;
        }

        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-body {
            padding: 17px;
        }

        .article-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 9px;
        }

        .article-category {
            color: var(--blue-soft);
            font-size: 10px;
        }

        .article-game {
            color: #929292;
            font-size: 10px;
        }

        .article-body h3 {
            color: white;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 8px;
        }

        .article-body p {
            color: #a9a9a9;
            font-size: 11px;
            line-height: 1.9;
            margin-bottom: 12px;
        }

        .article-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            color: var(--muted);
            font-size: 10px;
        }

        .article-read {
            color: var(--blue-soft);
            font-weight: 600;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 65px;
            padding: 25px 0;
            border-top: 1px solid var(--border);
            background: rgba(34,34,34,.35);
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .footer-logo {
            font-size: 18px;
            font-weight: 800;
        }

        .footer-text {
            color: var(--muted);
            font-size: 11px;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 950px) {

            .game-news-layout {
                grid-template-columns: 1fr;
            }

            .games-list {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 6px;
                scrollbar-width: none;
                -webkit-overflow-scrolling: touch;
                touch-action: pan-x;
            }

            .games-list::-webkit-scrollbar {
                display: none;
            }

            .game-item {
                flex: 0 0 170px;
                width: 170px;
            }

            .feed {
                grid-template-columns: 1fr;
            }

            .articles-grid {
                grid-template-columns: repeat(2,minmax(0,1fr));
            }

            .slide {
                grid-template-columns: 1fr;
            }

            .slide-image {
                display: none;
            }

            .slide-content {
                padding: 35px;
            }
        }

        /* =========================
           MOBILE PORTRAIT
        ========================= */

        @media (max-width: 650px) {

            body {
                background-attachment: scroll;
            }

            .container {
                width: calc(100% - 20px);
            }

            header {
                position: sticky;
            }

            .header-inner {
                min-height: 64px;
            }

            nav {
                display: none;
                position: absolute;
                top: 64px;
                right: 10px;
                left: 10px;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                padding: 8px;
                background: #252525;
                border: 1px solid var(--border);
                border-radius: 15px;
            }

            nav a {
                padding: 10px 12px;
            }

            .mobile-menu {
                display: block;
            }

            .hero {
                margin-top: 14px;
            }

            .slider {
                height: 470px;
                min-height: 470px;
                border-radius: 20px;
                touch-action: pan-y;
            }

            .slides {
                height: 100%;
                min-height: 100%;
            }

            .slide {
                height: 100%;
                min-height: 100%;
            }

            .slide-content {
                height: 100%;
                min-height: 470px;
                padding: 24px 20px 55px;
                justify-content: center;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            .slide-category {
                font-size: 11px;
                margin-bottom: 12px;
            }

            .slide-content h1 {
                font-size: 24px;
                line-height: 1.55;
                margin-bottom: 12px;
            }

            .slide-content p {
                font-size: 12px;
                line-height: 2;
                margin-bottom: 14px;
            }

            .slide-meta {
                font-size: 10px;
                margin-bottom: 15px;
            }

            .continue-btn {
                font-size: 12px;
                padding: 8px 15px;
            }

            .slider-controls {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                bottom: 14px;
            }

            .section-heading {
                margin-bottom: 14px;
            }

            .section-heading h2 {
                font-size: 18px;
            }

            .section-heading p {
                font-size: 10px;
            }

            .games-panel,
            .news-panel {
                padding: 14px;
                border-radius: 17px;
            }

            .game-item {
                flex-basis: 155px;
                width: 155px;
            }

            .feed {
                grid-template-columns: 1fr;
            }

            .articles-grid {
                grid-template-columns: 1fr;
            }

            .article-image {
                height: 210px;
            }

            .footer-inner {
                flex-direction: column;
                text-align: center;
            }
        }

        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            .slider {
                height: 450px;
                min-height: 450px;
            }

            .slide-content {
                min-height: 450px;
                padding: 20px 17px 50px;
            }

            .slide-content h1 {
                font-size: 21px;
            }

            .slide-content p {
                font-size: 11px;
            }

            .game-item {
                flex-basis: 145px;
                width: 145px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="container header-inner">

        <a href="index.html" class="logo">
            GAME<span>HUB</span>
        </a>

        <nav id="mainNav">
            <a href="index.html" class="active">خانه</a>
            <a href="#games-news">بازی‌ها</a>
            <a href="#articles">اخبار</a>
        </nav>

        <button
            class="mobile-menu"
            id="mobileMenu"
            type="button"
            aria-label="منو"
            aria-expanded="false"
        >
            ☰
        </button>

    </div>
</header>


<main class="container">

    <!-- HERO -->
    <section class="hero">

        <div
            class="slider"
            id="heroSlider"
            aria-label="اسلایدر اخبار"
        >

            <div
                class="slides"
                id="slides"
            ></div>

            <div
                class="slider-controls"
                id="sliderControls"
            ></div>

        </div>

    </section>


    <!-- GAMES + NEWS -->
    <section id="games-news">

        <div class="section-heading">

            <div>
                <h2>بازی‌ها و اخبار و اتفاقات</h2>
                <p>اخبار و ایونت‌های مربوط به بازی انتخاب‌شده</p>
            </div>

        </div>


        <div class="game-news-layout">

            <div class="games-panel">

                <div class="games-panel-title">
                    بازی‌ها
                </div>

                <div
                    class="games-list"
                    id="gamesList"
                >
                    <div class="empty">
                        در حال بارگذاری...
                    </div>
                </div>

            </div>


            <div class="news-panel">

                <div class="news-panel-head">

                    <h3>
                        اخبار و اتفاقات
                    </h3>

                    <div
                        class="selected-game-label"
                        id="selectedGameLabel"
                    >
                        -
                    </div>

                </div>

                <div
                    class="feed"
                    id="feed"
                >
                    <div class="empty">
                        در حال بارگذاری...
                    </div>
                </div>

            </div>

        </div>

    </section>


    <!-- ARTICLES -->
    <section id="articles">

        <div class="section-heading">

            <div>
                <h2>اخبار</h2>
                <p>آخرین مقاله‌ها و خبرهای گیمینگ</p>
            </div>

        </div>


        <div
            class="articles-grid"
            id="articlesGrid"
        >
            <div class="empty">
                در حال بارگذاری...
            </div>
        </div>

    </section>

</main>


<footer>

    <div class="container footer-inner">

        <div class="footer-logo">
            GAME<span>HUB</span>
        </div>

        <div class="footer-text">
            © 2026 GAMEHUB — تمامی حقوق محفوظ است.
        </div>

    </div>

</footer>


<script>

    /* =========================
       PATHS
    ========================= */

    const PATHS = {
        games: "./json/games.json",
        news: "./json/news.json",
        events: "./json/events.json",
        articles: "./json/articles.json"
    };


    /* =========================
       DATA
    ========================= */

    let allGames = [];
    let allNews = [];
    let allEvents = [];
    let allArticles = [];

    let selectedGameId = null;

    let allSlides = [];
    let currentSlide = 0;
    let slideTimer = null;

    let sliderStartX = 0;
    let sliderStartY = 0;
    let sliderCurrentX = 0;
    let sliderDragging = false;
    let sliderMoved = false;

    let sliderWidth = 0;


    /* =========================
       HELPERS
    ========================= */

    function toArray(data, key) {

        if (Array.isArray(data)) {
            return data;
        }

        if (data && Array.isArray(data[key])) {
            return data[key];
        }

        return [];
    }


    async function loadJSON(path) {

        const response = await fetch(path, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                `خطا در دریافت فایل: ${path}`
            );
        }

        return await response.json();
    }


    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================
       HERO SLIDER
       Android + Touch + Portrait
    ========================= */

    function renderSlides() {

        const slidesEl =
            document.getElementById("slides");

        const controlsEl =
            document.getElementById("sliderControls");

        if (!slidesEl || !controlsEl) {
            return;
        }

        if (!allArticles.length) {

            slidesEl.innerHTML = `
                <div class="slide">
                    <div class="slide-content">
                        <div class="empty">
                            هنوز مقاله‌ای ثبت نشده است.
                        </div>
                    </div>
                </div>
            `;

            controlsEl.innerHTML = "";

            return;
        }


        allSlides =
            allArticles.slice(0, 5);

        currentSlide = 0;


        slidesEl.innerHTML =
            allSlides.map((article) => {

                return `
                    <a
                        class="slide"
                        href="article.html?id=${encodeURIComponent(article.id)}"
                        draggable="false"
                    >

                        <div class="slide-image">

                            <img
                                src="${escapeHTML(article.image || "")}"
                                alt="${escapeHTML(article.title || "")}"
                                draggable="false"
                                onerror="this.style.display='none'"
                            >

                        </div>


                        <div class="slide-content">

                            <div class="slide-category">
                                ${escapeHTML(article.category || "خبر")}
                            </div>

                            <h1>
                                ${escapeHTML(article.title || "")}
                            </h1>

                            <p>
                                ${escapeHTML(article.description || "")}
                            </p>

                            <div class="slide-meta">

                                <span>
                                    ${escapeHTML(article.gameName || "")}
                                </span>

                                <span>
                                    ${escapeHTML(article.time || "")}
                                </span>

                                <span>
                                    ${escapeHTML(article.readTime || "")}
                                </span>

                            </div>

                            <span class="continue-btn">
                                ادامه خبر
                            </span>

                        </div>

                    </a>
                `;

            }).join("");


        controlsEl.innerHTML =
            allSlides.map((_, index) => {

                return `
                    <button
                        class="slider-dot ${index === 0 ? "active" : ""}"
                        type="button"
                        data-slide="${index}"
                        aria-label="اسلاید ${index + 1}"
                    ></button>
                `;

            }).join("");


        controlsEl
            .querySelectorAll(".slider-dot")
            .forEach(dot => {

                dot.addEventListener("click", function(event) {

                    event.preventDefault();
                    event.stopPropagation();

                    const index =
                        Number(this.dataset.slide);

                    goToSlide(index, true);
                });

            });


        updateSliderSize();
        updateSliderPosition(false);
        startSlider();
    }


    function updateSliderSize() {

        const slider =
            document.getElementById("heroSlider");

        if (!slider) {
            return;
        }

        sliderWidth =
            slider.getBoundingClientRect().width;
    }


    function updateSliderPosition(animate = true) {

        const slidesEl =
            document.getElementById("slides");

        if (!slidesEl) {
            return;
        }

        if (!animate) {
            slidesEl.style.transition = "none";
        } else {
            slidesEl.style.transition =
                "transform .45s cubic-bezier(.22,.61,.36,1)";
        }

        /*
            LTR transform برای اسلایدها.
            خود محتوا RTL باقی می‌ماند.
        */

        slidesEl.style.transform =
            `translate3d(${-currentSlide * 100}%, 0, 0)`;

        requestAnimationFrame(() => {

            if (!sliderDragging) {
                slidesEl.style.transition =
                    "transform .45s cubic-bezier(.22,.61,.36,1)";
            }

        });


        const dots =
            document.querySelectorAll(".slider-dot");

        dots.forEach((dot, index) => {

            dot.classList.toggle(
                "active",
                index === currentSlide
            );

        });
    }


    function goToSlide(index, restart = false) {

        if (!allSlides.length) {
            return;
        }

        const total =
            allSlides.length;

        currentSlide =
            ((index % total) + total) % total;

        updateSliderPosition(true);

        if (restart) {
            startSlider();
        }
    }


    function nextSlide() {

        if (!allSlides.length) {
            return;
        }

        goToSlide(currentSlide + 1);
    }


    function previousSlide() {

        if (!allSlides.length) {
            return;
        }

        goToSlide(currentSlide - 1);
    }


    function startSlider() {

        clearInterval(slideTimer);

        if (allSlides.length <= 1) {
            return;
        }

        slideTimer =
            setInterval(nextSlide, 5000);
    }


    function stopSlider() {

        clearInterval(slideTimer);
    }


    /*
        Touch slider:
        - Android
        - iPhone
        - Portrait
        - Landscape
        - راست به چپ برای اسلاید بعدی
        - چپ به راست برای اسلاید قبلی
    */

    function enableHeroTouch() {

        const slider =
            document.getElementById("heroSlider");

        const slidesEl =
            document.getElementById("slides");

        if (!slider || !slidesEl) {
            return;
        }


        slider.addEventListener(
            "touchstart",
            function(event) {

                if (!event.touches || !event.touches.length) {
                    return;
                }

                stopSlider();

                updateSliderSize();

                sliderDragging = true;
                sliderMoved = false;

                sliderStartX =
                    event.touches[0].clientX;

                sliderStartY =
                    event.touches[0].clientY;

                sliderCurrentX =
                    sliderStartX;

                slidesEl.classList.add("dragging");

            },
            {
                passive: true
            }
        );


        slider.addEventListener(
            "touchmove",
            function(event) {

                if (!sliderDragging) {
                    return;
                }

                if (!event.touches || !event.touches.length) {
                    return;
                }

                sliderCurrentX =
                    event.touches[0].clientX;

                const currentY =
                    event.touches[0].clientY;

                const deltaX =
                    sliderCurrentX - sliderStartX;

                const deltaY =
                    currentY - sliderStartY;


                /*
                    اگر حرکت عمودی باشد،
                    اسکرول صفحه مختل نمی‌شود.
                */

                if (
                    !sliderMoved &&
                    Math.abs(deltaY) > Math.abs(deltaX) &&
                    Math.abs(deltaY) > 8
                ) {
                    sliderDragging = false;
                    slidesEl.classList.remove("dragging");
                    startSlider();
                    return;
                }


                if (Math.abs(deltaX) < 5) {
                    return;
                }

                sliderMoved = true;

                /*
                    جلوگیری از پرش اسلاید در Android
                */

                const base =
                    -(currentSlide * sliderWidth);

                const resistance =
                    deltaX * 0.85;

                slidesEl.style.transform =
                    `translate3d(${base + resistance}px, 0, 0)`;

            },
            {
                passive: true
            }
        );


        slider.addEventListener(
            "touchend",
            function() {

                if (!sliderDragging) {
                    return;
                }

                sliderDragging = false;

                slidesEl.classList.remove("dragging");

                const deltaX =
                    sliderCurrentX - sliderStartX;

                const threshold =
                    Math.max(
                        45,
                        Math.min(100, sliderWidth * 0.15)
                    );


                if (
                    sliderMoved &&
                    Math.abs(deltaX) >= threshold
                ) {

                    /*
                        Swipe راست به چپ:
                        deltaX منفی
                        => اسلاید بعدی
                    */

                    if (deltaX < 0) {
                        nextSlide();
                    } else {
                        previousSlide();
                    }

                } else {

                    updateSliderPosition(true);
                    startSlider();

                }

                sliderMoved = false;

            },
            {
                passive: true
            }
        );


        slider.addEventListener(
            "touchcancel",
            function() {

                sliderDragging = false;
                sliderMoved = false;

                slidesEl.classList.remove("dragging");

                updateSliderPosition(true);
                startSlider();

            },
            {
                passive: true
            }
        );


        /*
            جلوگیری از drag پیش‌فرض تصویر
        */

        slider.addEventListener(
            "dragstart",
            function(event) {
                event.preventDefault();
            }
        );


        /*
            وقتی کاربر ماوس/تاچ را روی اسلایدر نگه می‌دارد
            autoplay موقتاً متوقف می‌شود.
        */

        slider.addEventListener(
            "mouseenter",
            stopSlider
        );

        slider.addEventListener(
            "mouseleave",
            startSlider
        );
    }


    /* =========================
       RESIZE
    ========================= */

    function handleResize() {

        updateSliderSize();
        updateSliderPosition(false);
    }


    window.addEventListener(
        "resize",
        handleResize,
        {
            passive: true
        }
    );


    window.addEventListener(
        "orientationchange",
        function() {

            setTimeout(() => {

                updateSliderSize();
                updateSliderPosition(false);

            }, 250);

        },
        {
            passive: true
        }
    );


    /* =========================
       GAMES
    ========================= */

    function renderGames() {

        const gamesList =
            document.getElementById("gamesList");

        if (!gamesList) {
            return;
        }

        if (!allGames.length) {

            gamesList.innerHTML = `
                <div class="empty">
                    بازی‌ای پیدا نشد.
                </div>
            `;

            return;
        }


        gamesList.innerHTML =
            allGames.map(game => {

                const gameId =
                    String(game.id ?? "");

                const gameName =
                    String(game.name ?? "");

                const image =
                    game.icon || game.image || "";

                return `
                    <button
                        type="button"
                        class="game-item ${
                            gameId === String(selectedGameId)
                                ? "active"
                                : ""
                        }"
                        data-game-id="${escapeHTML(gameId)}"
                    >

                        ${
                            image
                                ? `
                                    <img
                                        class="game-icon"
                                        src="${escapeHTML(image)}"
                                        alt="${escapeHTML(gameName)}"
                                        loading="lazy"
                                        onerror="this.style.display='none'"
                                    >
                                `
                                : `
                                    <div class="game-icon"></div>
                                `
                        }

                        <span class="game-item-name">
                            ${escapeHTML(gameName)}
                        </span>

                    </button>
                `;

            }).join("");


        gamesList
            .querySelectorAll(".game-item")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    function() {

                        selectGame(
                            this.dataset.gameId
                        );

                    }
                );

            });
    }


    function selectGame(gameId) {

        selectedGameId =
            String(gameId);

        renderGames();
        renderGameFeed();
    }


    /* =========================
       NEWS + EVENTS
    ========================= */

    function renderGameFeed() {

        const feedEl =
            document.getElementById("feed");

        const labelEl =
            document.getElementById("selectedGameLabel");

        if (!feedEl || !labelEl) {
            return;
        }


        const selectedGame =
            allGames.find(
                game =>
                    String(game.id) ===
                    String(selectedGameId)
            );


        labelEl.textContent =
            selectedGame
                ? selectedGame.name
                : "-";


        if (!selectedGame) {

            feedEl.innerHTML = `
                <div class="empty">
                    بازی انتخاب نشده است.
                </div>
            `;

            return;
        }


        const news =
            allNews
                .filter(
                    item =>
                        String(item.gameId) ===
                        String(selectedGameId)
                )
                .map(item => ({
                    ...item,
                    feedType: "خبر",
                    isEvent: false
                }));


        const events =
            allEvents
                .filter(
                    item =>
                        String(item.gameId) ===
                        String(selectedGameId)
                )
                .map(item => ({
                    ...item,
                    feedType: "ایونت",
                    isEvent: true
                }));


        const feed = [
            ...events,
            ...news
        ];


        if (!feed.length) {

            feedEl.innerHTML = `
                <div class="empty">
                    برای ${escapeHTML(selectedGame.name)}
                    هنوز خبر یا اتفاقی ثبت نشده است.
                </div>
            `;

            return;
        }


        feedEl.innerHTML =
            feed.map(item => {

                return `
                    <article
                        class="feed-card ${
                            item.isEvent ? "event" : ""
                        }"
                    >

                        <div class="feed-top">

                            <span class="feed-type">
                                ${
                                    item.isEvent
                                        ? "مهم"
                                        : escapeHTML(item.feedType)
                                }
                            </span>

                            <span class="feed-time">
                                ${escapeHTML(item.time || "")}
                            </span>

                        </div>

                        <h4>
                            ${escapeHTML(item.title || "")}
                        </h4>

                        <p>
                            ${escapeHTML(
                                item.description ||
                                item.summary ||
                                ""
                            )}
                        </p>

                    </article>
                `;

            }).join("");
    }


    /* =========================
       ARTICLES
    ========================= */

    function renderArticles() {

        const articlesGrid =
            document.getElementById("articlesGrid");

        if (!articlesGrid) {
            return;
        }

        if (!allArticles.length) {

            articlesGrid.innerHTML = `
                <div class="empty">
                    هنوز مقاله‌ای ثبت نشده است.
                </div>
            `;

            return;
        }


        articlesGrid.innerHTML =
            allArticles.map(article => {

                return `
                    <a
                        class="article-card"
                        href="article.html?id=${encodeURIComponent(article.id)}"
                    >

                        <div class="article-image">

                            <img
                                src="${escapeHTML(article.image || "")}"
                                alt="${escapeHTML(article.title || "")}"
                                loading="lazy"
                                onerror="this.style.display='none'"
                            >

                        </div>


                        <div class="article-body">

                            <div class="article-meta-top">

                                <span class="article-category">
                                    ${escapeHTML(article.category || "خبر")}
                                </span>

                                <span class="article-game">
                                    ${escapeHTML(article.gameName || "")}
                                </span>

                            </div>


                            <h3>
                                ${escapeHTML(article.title || "")}
                            </h3>


                            <p>
                                ${escapeHTML(article.description || "")}
                            </p>


                            <div class="article-footer">

                                <span>
                                    ${escapeHTML(article.time || "")}
                                </span>

                                <span class="article-read">
                                    ادامه
                                </span>

                            </div>

                        </div>

                    </a>
                `;

            }).join("");
    }


    /* =========================
       MOBILE MENU
    ========================= */

    function setupMobileMenu() {

        const button =
            document.getElementById("mobileMenu");

        const nav =
            document.getElementById("mainNav");

        if (!button || !nav) {
            return;
        }


        button.addEventListener(
            "click",
            function() {

                const isOpen =
                    nav.style.display === "flex";

                nav.style.display =
                    isOpen ? "none" : "flex";

                button.setAttribute(
                    "aria-expanded",
                    String(!isOpen)
                );

            }
        );


        nav.querySelectorAll("a")
            .forEach(link => {

                link.addEventListener(
                    "click",
                    function() {

                        if (
                            window.innerWidth <= 650
                        ) {

                            nav.style.display = "none";

                            button.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                        }

                    }
                );

            });
    }


    /* =========================
       PAGE VISIBILITY
       برای برگشت از صفحه مقاله
    ========================= */

    document.addEventListener(
        "visibilitychange",
        function() {

            if (
                document.visibilityState === "visible"
            ) {

                updateSliderSize();
                updateSliderPosition(false);
                startSlider();

            } else {

                stopSlider();

            }

        }
    );


    window.addEventListener(
        "pageshow",
        function() {

            setTimeout(() => {

                updateSliderSize();
                updateSliderPosition(false);
                startSlider();

            }, 100);

        }
    );


    /* =========================
       INIT
    ========================= */

    async function init() {

        try {

            const [
                gamesData,
                newsData,
                eventsData,
                articlesData
            ] = await Promise.all([

                loadJSON(PATHS.games),
                loadJSON(PATHS.news),
                loadJSON(PATHS.events),
                loadJSON(PATHS.articles)

            ]);


            allGames =
                toArray(
                    gamesData,
                    "games"
                );


            allNews =
                toArray(
                    newsData,
                    "news"
                );


            allEvents =
                toArray(
                    eventsData,
                    "events"
                );


            allArticles =
                toArray(
                    articlesData,
                    "articles"
                );


            selectedGameId =
                allGames.length
                    ? String(allGames[0].id)
                    : null;


            renderSlides();
            renderGames();
            renderGameFeed();
            renderArticles();

            enableHeroTouch();
            setupMobileMenu();

            /*
                یک بار دیگر بعد از کامل شدن DOM
                اندازه اسلایدر را محاسبه می‌کنیم.
            */

            setTimeout(() => {

                updateSliderSize();
                updateSliderPosition(false);

            }, 100);


        } catch (error) {

            console.error(error);


            const gamesList =
                document.getElementById("gamesList");

            const feed =
                document.getElementById("feed");

            const articlesGrid =
                document.getElementById("articlesGrid");


            if (gamesList) {

                gamesList.innerHTML = `
                    <div class="empty">
                        خطا در بارگذاری اطلاعات بازی‌ها.
                    </div>
                `;

            }


            if (feed) {

                feed.innerHTML = `
                    <div class="empty">
                        خطا در بارگذاری اخبار و اتفاقات.
                    </div>
                `;

            }


            if (articlesGrid) {

                articlesGrid.innerHTML = `
                    <div class="empty">
                        خطا در بارگذاری اخبار.
                    </div>
                `;

            }

        }

    }


    /*
        اجرای اصلی بعد از آماده شدن کامل صفحه
    */

    if (document.readyState === "loading") {

        document.addEventListener(
            "DOMContentLoaded",
            init,
            {
                once: true
            }
        );

    } else {

        init();

    }

</script>
