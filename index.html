<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAMEHUB | گیم‌هاب</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #222222;
            --bg-soft: #2b2b2b;
            --blue-dark: #2E4192;
            --blue: #4E6FF8;
            --blue-soft: #9aabff;
            --white: #ffffff;
            --text: #eeeeee;
            --muted: #a5a5a5;
            --border: rgba(255,255,255,0.08);
            --card: #2b2b2b;
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Vazirmatn", sans-serif;
            background: linear-gradient(
                to bottom,
                #222222 0%,
                #2b2b2b 35%,
                #2E4192 100%,
                #4E6FF8 100%
            );
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.8;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(34, 34, 34, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: var(--white);
            white-space: nowrap;
        }

        .logo span {
            color: var(--blue);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: #d6d6d6;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s ease;
        }

        nav a:hover,
        nav a.active {
            color: var(--blue);
        }

        .mobile-menu {
            display: none;
            border: 1px solid var(--border);
            background: var(--bg-soft);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            margin-top: 28px;
        }

        .slider {
            position: relative;
            min-height: 390px;
            overflow: hidden;
            border-radius: 26px;
            border: 1px solid var(--border);
            background: #2b2b2b;
        }

        .slides {
            position: relative;
            min-height: 390px;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            overflow: hidden;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        .slide-image {
            height: 390px;
            overflow: hidden;
        }

        .slide-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 38px;
            background: linear-gradient(
                135deg,
                #222222,
                #2b2b2b 55%,
                #2E4192
            );
        }

        .slide-category {
            width: fit-content;
            background: rgba(78,111,248,0.18);
            color: var(--blue-soft);
            border: 1px solid rgba(78,111,248,0.35);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .slide-content h1 {
            font-size: clamp(24px, 3vw, 38px);
            line-height: 1.4;
            margin-bottom: 13px;
            color: white;
        }

        .slide-content p {
            color: #c3c3c3;
            font-size: 14px;
            max-width: 560px;
            margin-bottom: 18px;
        }

        .slide-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 15px;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 20px;
        }

        .continue-btn {
            width: fit-content;
            background: var(--blue);
            color: white;
            padding: 9px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
        }

        .slider-controls {
            position: absolute;
            bottom: 18px;
            right: 25px;
            display: flex;
            gap: 7px;
            z-index: 5;
        }

        .slider-dot {
            width: 8px;
            height: 8px;
            border: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .slider-dot.active {
            width: 25px;
            border-radius: 20px;
            background: var(--blue);
        }

        /* =========================
           SECTION
        ========================= */

        section {
            margin-top: 45px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
        }

        .section-heading h2 {
            font-size: 22px;
            color: white;
        }

        .section-heading p {
            color: var(--muted);
            font-size: 12px;
        }

        /* =========================
           GAMES + NEWS
        ========================= */

        .game-news-layout {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            gap: 18px;
            align-items: stretch;
        }

        .games-panel {
            background: linear-gradient(
                160deg,
                #222222,
                #2b2b2b 45%,
                #2E4192
            );
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
        }

        .games-panel-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            color: white;
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .game-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: 1px solid transparent;
            background: rgba(255,255,255,0.04);
            color: #d7d7d7;
            padding: 10px;
            border-radius: 14px;
            cursor: pointer;
            text-align: right;
            transition: 0.2s ease;
        }

        .game-item:hover {
            background: rgba(255,255,255,0.07);
        }

        .game-item.active {
            background: rgba(78,111,248,0.18);
            border-color: rgba(78,111,248,0.45);
            color: white;
        }

        .game-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            object-fit: cover;
            flex-shrink: 0;
            background: #202020;
        }

        .game-item-name {
            font-size: 12px;
            font-weight: 600;
        }

        .news-panel {
            min-width: 0;
            background: linear-gradient(
                145deg,
                #2b2b2b,
                #2E4192
            );
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
        }

        .news-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .news-panel-head h3 {
            color: white;
            font-size: 17px;
        }

        .selected-game-label {
            color: var(--blue-soft);
            font-size: 12px;
            font-weight: 600;
        }

        .feed {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .feed-card {
            background: rgba(34,34,34,0.72);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 15px;
            padding: 14px;
            min-width: 0;
            transition: 0.2s ease;
        }

        .feed-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.13);
        }

        .feed-card.event {
            border-right: 3px solid var(--blue);
        }

        .feed-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .feed-type {
            font-size: 10px;
            color: var(--blue-soft);
            background: rgba(78,111,248,0.12);
            padding: 3px 8px;
            border-radius: 999px;
        }

        .feed-card.event .feed-type {
            color: white;
            background: var(--blue);
        }

        .feed-time {
            color: var(--muted);
            font-size: 10px;
        }

        .feed-card h4 {
            font-size: 13px;
            line-height: 1.7;
            color: white;
            margin-bottom: 6px;
        }

        .feed-card p {
            font-size: 11px;
            color: #aaa;
            line-height: 1.8;
        }

        .empty {
            padding: 30px 15px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           ARTICLES
        ========================= */

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .article-card {
            overflow: hidden;
            background: linear-gradient(
                145deg,
                #222222,
                #2b2b2b
            );
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: 0.25s ease;
        }

        .article-card:hover {
            transform: translateY(-4px);
            border-color: rgba(78,111,248,0.4);
        }

        .article-image {
            height: 190px;
            overflow: hidden;
            background: #202020;
        }

        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s ease;
        }

        .article-card:hover .article-image img {
            transform: scale(1.04);
        }

        .article-body {
            padding: 17px;
        }

        .article-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 9px;
        }

        .article-category {
            color: var(--blue-soft);
            font-size: 10px;
        }

        .article-game {
            color: #929292;
            font-size: 10px;
        }

        .article-body h3 {
            color: white;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 8px;
        }

        .article-body p {
            color: #a9a9a9;
            font-size: 11px;
            line-height: 1.9;
            margin-bottom: 12px;
        }

        .article-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            color: var(--muted);
            font-size: 10px;
        }

        .article-read {
            color: var(--blue-soft);
            font-weight: 600;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 65px;
            padding: 25px 0;
            border-top: 1px solid var(--border);
            background: rgba(34,34,34,0.35);
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .footer-logo {
            font-size: 18px;
            font-weight: 800;
        }

        .footer-logo span {
            color: var(--blue);
        }

        .footer-text {
            color: var(--muted);
            font-size: 11px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 950px) {
            .game-news-layout {
                grid-template-columns: 1fr;
            }

            .games-list {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 4px;
            }

            .game-item {
                min-width: 170px;
            }

            .feed {
                grid-template-columns: 1fr;
            }

            .articles-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .slide {
                grid-template-columns: 1fr;
            }

            .slide-image {
                display: none;
            }
        }

        @media (max-width: 650px) {
            .container {
                width: min(100% - 20px, 1180px);
            }

            header {
                position: static;
            }

            nav {
                display: none;
            }

            .mobile-menu {
                display: block;
            }

            .header-inner {
                min-height: 68px;
            }

            .hero {
                margin-top: 15px;
            }

            .slider,
            .slides {
                min-height: 430px;
            }

            .slide-content {
                padding: 25px;
            }

            .slide-content h1 {
                font-size: 25px;
            }

            .section-heading h2 {
                font-size: 19px;
            }

            .articles-grid {
                grid-template-columns: 1fr;
            }

            .article-image {
                height: 210px;
            }

            .footer-inner {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="container header-inner">

        <a href="index.html" class="logo">
            GAME<span>HUB</span>
        </a>

        <nav>
            <a href="index.html" class="active">خانه</a>
            <a href="#games-news">بازی‌ها</a>
            <a href="#articles">اخبار</a>
        </nav>

        <button class="mobile-menu" type="button" aria-label="منو">
            ☰
        </button>

    </div>
</header>


<main class="container">

    <!-- HERO -->
    <section class="hero">

        <div class="slider">
            <div class="slides" id="slides"></div>
            <div class="slider-controls" id="sliderControls"></div>
        </div>

    </section>


    <!-- GAMES + NEWS -->
    <section id="games-news">

        <div class="section-heading">
            <div>
                <h2>بازی‌ها و اخبار و اتفاقات</h2>
                <p>اخبار و ایونت‌های مربوط به بازی انتخاب‌شده</p>
            </div>
        </div>

        <div class="game-news-layout">

            <!-- GAME SELECTOR -->
            <div class="games-panel">

                <div class="games-panel-title">
                    بازی‌ها
                </div>

                <div class="games-list" id="gamesList">
                    <div class="empty">در حال بارگذاری...</div>
                </div>

            </div>


            <!-- NEWS + EVENTS -->
            <div class="news-panel">

                <div class="news-panel-head">

                    <h3>
                        اخبار و اتفاقات
                    </h3>

                    <div
                        class="selected-game-label"
                        id="selectedGameLabel"
                    >
                        -
                    </div>

                </div>

                <div class="feed" id="feed">
                    <div class="empty">
                        در حال بارگذاری...
                    </div>
                </div>

            </div>

        </div>

    </section>


    <!-- ARTICLES -->
    <section id="articles">

        <div class="section-heading">

            <div>
                <h2>اخبار</h2>
                <p>آخرین مقاله‌ها و خبرهای گیمینگ</p>
            </div>

        </div>

        <div class="articles-grid" id="articlesGrid">

            <div class="empty">
                در حال بارگذاری...
            </div>

        </div>

    </section>

</main>


<footer>

    <div class="container footer-inner">

        <div class="footer-logo">
            GAME<span>HUB</span>
        </div>

        <div class="footer-text">
            © 2026 GAMEHUB — تمامی حقوق محفوظ است.
        </div>

    </div>

</footer>


<script>

    const PATHS = {
        games: "./json/games.json",
        news: "./json/news.json",
        events: "./json/events.json",
        articles: "./json/articles.json"
    };


    let allGames = [];
    let allNews = [];
    let allEvents = [];
    let allArticles = [];

    let selectedGameId = null;

    let allSlides = [];
    let currentSlide = 0;
    let slideTimer = null;


    /* =========================
       HELPERS
    ========================= */

    function toArray(data, key) {

        if (Array.isArray(data)) {
            return data;
        }

        if (data && Array.isArray(data[key])) {
            return data[key];
        }

        return [];
    }


    async function loadJSON(path) {

        const response = await fetch(path, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                `خطا در دریافت فایل: ${path}`
            );
        }

        return await response.json();
    }


    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================
       HERO SLIDER
    ========================= */

    function renderSlides() {

        const slidesEl =
            document.getElementById("slides");

        const controlsEl =
            document.getElementById("sliderControls");

        if (!allArticles.length) {

            slidesEl.innerHTML = `
                <div class="empty">
                    هنوز مقاله‌ای ثبت نشده است.
                </div>
            `;

            controlsEl.innerHTML = "";

            return;
        }


        allSlides = allArticles.slice(0, 5);


        slidesEl.innerHTML =
            allSlides.map((article, index) => {

                return `
                    <a
                        class="slide ${index === 0 ? "active" : ""}"
                        href="article.html?id=${encodeURIComponent(article.id)}"
                    >

                        <div class="slide-image">

                            <img
                                src="${escapeHTML(article.image || "")}"
                                alt="${escapeHTML(article.title)}"
                                onerror="this.style.display='none'"
                            >

                        </div>


                        <div class="slide-content">

                            <div class="slide-category">
                                ${escapeHTML(article.category || "خبر")}
                            </div>

                            <h1>
                                ${escapeHTML(article.title)}
                            </h1>

                            <p>
                                ${escapeHTML(article.description || "")}
                            </p>

                            <div class="slide-meta">

                                <span>
                                    ${escapeHTML(article.gameName || "")}
                                </span>

                                <span>
                                    ${escapeHTML(article.time || "")}
                                </span>

                                <span>
                                    ${escapeHTML(article.readTime || "")}
                                </span>

                            </div>

                            <span class="continue-btn">
                                ادامه خبر
                            </span>

                        </div>

                    </a>
                `;

            }).join("");


        controlsEl.innerHTML =
            allSlides.map((_, index) => {

                return `
                    <button
                        class="slider-dot ${index === 0 ? "active" : ""}"
                        type="button"
                        onclick="goToSlide(${index})"
                        aria-label="اسلاید ${index + 1}"
                    ></button>
                `;

            }).join("");


        startSlider();
    }


    function goToSlide(index) {

        const slides =
            document.querySelectorAll(".slide");

        const dots =
            document.querySelectorAll(".slider-dot");

        if (!slides.length) return;

        currentSlide =
            (index + slides.length) % slides.length;


        slides.forEach((slide, i) => {

            slide.classList.toggle(
                "active",
                i === currentSlide
            );

        });


        dots.forEach((dot, i) => {

            dot.classList.toggle(
                "active",
                i === currentSlide
            );

        });

    }


    function nextSlide() {

        if (!allSlides.length) return;

        goToSlide(currentSlide + 1);
    }


    function startSlider() {

        clearInterval(slideTimer);

        if (allSlides.length <= 1) {
            return;
        }

        slideTimer = setInterval(
            nextSlide,
            5000
        );
    }


    /* =========================
       GAMES
    ========================= */

    function renderGames() {

        const gamesList =
            document.getElementById("gamesList");


        if (!allGames.length) {

            gamesList.innerHTML = `
                <div class="empty">
                    بازی‌ای پیدا نشد.
                </div>
            `;

            return;
        }


        gamesList.innerHTML =
            allGames.map(game => {

                return `
                    <button
                        type="button"
                        class="game-item ${
                            game.id === selectedGameId
                                ? "active"
                                : ""
                        }"
                        onclick="selectGame('${escapeHTML(game.id)}')"
                    >

                        ${
                            game.icon || game.image
                                ? `
                                    <img
                                        class="game-icon"
                                        src="${escapeHTML(game.icon || game.image)}"
                                        alt="${escapeHTML(game.name)}"
                                        onerror="this.style.display='none'"
                                    >
                                `
                                : `
                                    <div class="game-icon"></div>
                                `
                        }

                        <span class="game-item-name">
                            ${escapeHTML(game.name)}
                        </span>

                    </button>
                `;

            }).join("");
    }


    function selectGame(gameId) {

        selectedGameId = gameId;

        renderGames();
        renderGameFeed();
    }


    /* =========================
       NEWS + EVENTS
    ========================= */

    function renderGameFeed() {

        const feedEl =
            document.getElementById("feed");

        const labelEl =
            document.getElementById("selectedGameLabel");


        const selectedGame =
            allGames.find(
                game => game.id === selectedGameId
            );


        labelEl.textContent =
            selectedGame
                ? selectedGame.name
                : "-";


        if (!selectedGame) {

            feedEl.innerHTML = `
                <div class="empty">
                    بازی انتخاب نشده است.
                </div>
            `;

            return;
        }


        const news =
            allNews
                .filter(
                    item =>
                        item.gameId === selectedGameId
                )
                .map(item => ({
                    ...item,
                    feedType: "خبر",
                    isEvent: false
                }));


        const events =
            allEvents
                .filter(
                    item =>
                        item.gameId === selectedGameId
                )
                .map(item => ({
                    ...item,
                    feedType: "ایونت",
                    isEvent: true
                }));


        /*
            ایونت‌ها اول نمایش داده می‌شوند
            تا اتفاقات مهم بالاتر باشند.
        */

        const feed = [
            ...events,
            ...news
        ];


        if (!feed.length) {

            feedEl.innerHTML = `
                <div class="empty">
                    برای ${escapeHTML(selectedGame.name)}
                    هنوز خبر یا اتفاقی ثبت نشده است.
                </div>
            `;

            return;
        }


        feedEl.innerHTML =
            feed.map(item => {

                return `
                    <article
                        class="feed-card ${
                            item.isEvent ? "event" : ""
                        }"
                    >

                        <div class="feed-top">

                            <span class="feed-type">
                                ${
                                    item.isEvent
                                        ? "مهم"
                                        : escapeHTML(item.feedType)
                                }
                            </span>

                            <span class="feed-time">
                                ${escapeHTML(item.time || "")}
                            </span>

                        </div>


                        <h4>
                            ${escapeHTML(item.title || "")}
                        </h4>


                        <p>
                            ${escapeHTML(
                                item.description ||
                                item.summary ||
                                ""
                            )}
                        </p>

                    </article>
                `;

            }).join("");
    }


    /* =========================
       ARTICLES
    ========================= */

    function renderArticles() {

        const articlesGrid =
            document.getElementById("articlesGrid");


        if (!allArticles.length) {

            articlesGrid.innerHTML = `
                <div class="empty">
                    هنوز مقاله‌ای ثبت نشده است.
                </div>
            `;

            return;
        }


        articlesGrid.innerHTML =
            allArticles.map(article => {

                return `
                    <a
                        class="article-card"
                        href="article.html?id=${encodeURIComponent(article.id)}"
                    >

                        <div class="article-image">

                            <img
                                src="${escapeHTML(article.image || "")}"
                                alt="${escapeHTML(article.title)}"
                                onerror="this.style.display='none'"
                            >

                        </div>


                        <div class="article-body">

                            <div class="article-meta-top">

                                <span class="article-category">
                                    ${escapeHTML(article.category || "خبر")}
                                </span>

                                <span class="article-game">
                                    ${escapeHTML(article.gameName || "")}
                                </span>

                            </div>


                            <h3>
                                ${escapeHTML(article.title)}
                            </h3>


                            <p>
                                ${escapeHTML(article.description || "")}
                            </p>


                            <div class="article-footer">

                                <span>
                                    ${escapeHTML(article.time || "")}
                                </span>

                                <span class="article-read">
                                    ادامه
                                </span>

                            </div>

                        </div>

                    </a>
                `;

            }).join("");
    }


    /* =========================
       INIT
    ========================= */

    async function init() {

        try {

            const [
                gamesData,
                newsData,
                eventsData,
                articlesData
            ] = await Promise.all([

                loadJSON(PATHS.games),
                loadJSON(PATHS.news),
                loadJSON(PATHS.events),
                loadJSON(PATHS.articles)

            ]);


            allGames =
                toArray(gamesData, "games");


            allNews =
                toArray(newsData, "news");


            allEvents =
                toArray(eventsData, "events");


            allArticles =
                toArray(articlesData, "articles");


            /*
                اولین بازی به صورت خودکار انتخاب می‌شود.
            */

            selectedGameId =
                allGames.length
                    ? allGames[0].id
                    : null;


            renderSlides();
            renderGames();
            renderGameFeed();
            renderArticles();


        } catch (error) {

            console.error(error);

            document.getElementById("gamesList").innerHTML = `
                <div class="empty">
                    خطا در بارگذاری اطلاعات بازی‌ها.
                </div>
            `;

            document.getElementById("feed").innerHTML = `
                <div class="empty">
                    خطا در بارگذاری اخبار و اتفاقات.
                </div>
            `;

            document.getElementById("articlesGrid").innerHTML = `
                <div class="empty">
                    خطا در بارگذاری اخبار.
                </div>
            `;

        }

    }


    /* =========================
       MOBILE MENU
    ========================= */

    document
        .querySelector(".mobile-menu")
        .addEventListener("click", () => {

            const nav =
                document.querySelector("nav");

            const isVisible =
                nav.style.display === "flex";

            nav.style.display =
                isVisible ? "none" : "flex";

            if (!isVisible) {

                nav.style.position = "absolute";
                nav.style.top = "68px";
                nav.style.right = "10px";
                nav.style.left = "10px";
                nav.style.padding = "15px";
                nav.style.flexDirection = "column";
                nav.style.alignItems = "flex-start";
                nav.style.background = "#222222";
                nav.style.border = "1px solid rgba(255,255,255,0.08)";
                nav.style.borderRadius = "16px";
            }

        });


    init();

</script>

</body>
