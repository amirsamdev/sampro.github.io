<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>خبر | GAMEHUB</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {
            --bg:#222222;
            --bg-soft:#2b2b2b;
            --blue-dark:#2E4192;
            --blue:#4E6FF8;
            --blue-soft:#9aabff;
            --white:#ffffff;
            --text:#eeeeee;
            --muted:#a5a5a5;
            --border:rgba(255,255,255,0.08);
            --card:#2b2b2b;
            --radius:20px;
        }


        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
        }


        html {
            scroll-behavior:smooth;
        }


        body {
            font-family:"Vazirmatn",sans-serif;

            background:linear-gradient(
                to bottom,
                #222222 0%,
                #2b2b2b 35%,
                #2E4192 100%,
                #4E6FF8 100%
            );

            background-attachment:fixed;

            color:var(--text);

            line-height:2;

            min-height:100vh;
        }


        a {
            color:inherit;
            text-decoration:none;
        }


        img {
            max-width:100%;
            display:block;
        }


        .container {
            width:min(900px,calc(100% - 30px));
            margin:auto;
        }


        /* HEADER */

        header {
            position:sticky;
            top:0;
            z-index:100;

            background:rgba(34,34,34,.92);

            backdrop-filter:blur(15px);

            border-bottom:1px solid var(--border);
        }


        .header-inner {
            min-height:75px;

            display:flex;

            align-items:center;

            justify-content:space-between;
        }


        .logo {
            display:flex;

            align-items:center;

            gap:10px;

            font-size:23px;

            font-weight:800;
        }


        .logo-mark {
            width:42px;
            height:42px;

            display:grid;

            place-items:center;

            border-radius:13px;

            background:linear-gradient(
                135deg,
                #4E6FF8,
                #2E4192
            );
        }


        .back {
            color:#a5a5a5;

            font-size:13px;

            transition:.2s;
        }


        .back:hover {
            color:#ffffff;
        }


        /* ARTICLE */

        main {
            padding:45px 0 80px;
        }


        .article {
            overflow:hidden;

            background:#2b2b2b;

            border:1px solid var(--border);

            border-radius:26px;
        }


        .article-image {
            width:100%;
            height:470px;

            object-fit:cover;

            background:#2b2b2b;
        }


        .article-content {
            padding:40px;
        }


        .category {
            display:inline-flex;

            padding:5px 13px;

            border-radius:999px;

            background:#4E6FF8;

            color:#ffffff;

            font-size:11px;

            font-weight:600;

            margin-bottom:13px;
        }


        .game {
            color:#9aabff;

            font-size:13px;

            margin-bottom:7px;
        }


        h1 {
            font-size:clamp(27px,5vw,45px);

            line-height:1.5;

            font-weight:800;

            margin-bottom:14px;
        }


        .description {
            color:#eeeeee;

            font-size:15px;

            line-height:2.1;

            margin-bottom:20px;
        }


        .meta {
            display:flex;

            flex-wrap:wrap;

            gap:18px;

            padding-bottom:20px;

            margin-bottom:25px;

            border-bottom:1px solid var(--border);

            color:#a5a5a5;

            font-size:11px;
        }


        .content p {
            color:#eeeeee;

            font-size:15px;

            line-height:2.3;

            margin-bottom:22px;
        }


        .author-box {
            display:flex;

            align-items:center;

            gap:12px;

            margin-top:35px;

            padding:15px;

            border-radius:14px;

            background:rgba(255,255,255,.035);

            border:1px solid var(--border);
        }


        .author-avatar {
            width:40px;
            height:40px;

            display:grid;

            place-items:center;

            border-radius:12px;

            background:#4E6FF8;
        }


        .author-name {
            font-size:12px;

            font-weight:700;
        }


        .author-label {
            color:#777777;

            font-size:10px;
        }


        .error {
            padding:70px 20px;

            text-align:center;

            background:#2b2b2b;

            border:1px solid var(--border);

            border-radius:22px;

            color:#a5a5a5;
        }


        .error h2 {
            color:#ffffff;

            margin-bottom:8px;
        }


        .home-btn {
            display:inline-block;

            margin-top:18px;

            padding:9px 18px;

            border-radius:11px;

            background:#4E6FF8;

            color:#ffffff;

            font-size:12px;
        }


        footer {
            border-top:1px solid var(--border);

            padding:25px 0;

            color:#777777;

            font-size:11px;

            text-align:center;
        }


        @media(max-width:650px) {

            .article-image {
                height:280px;
            }


            .article-content {
                padding:25px 18px;
            }


            .description {
                font-size:13px;
            }


            .content p {
                font-size:13px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="container header-inner">

        <a
            href="index.html"
            class="logo"
        >

            <div class="logo-mark">
                🎮
            </div>

            GAMEHUB

        </a>


        <a
            href="index.html"
            class="back"
        >
            ← بازگشت به گیم‌هاب
        </a>

    </div>

</header>


<main>

    <div class="container">

        <div id="articleContainer">

            <div class="error">
                در حال بارگذاری مقاله...
            </div>

        </div>

    </div>

</main>


<footer>
    © 2026 GAMEHUB — ساخته شده برای گیمرها 🎮
</footer>


<script>

const ARTICLE_PATH =
    "./json/articles.json";


function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function toArray(data) {

    if (Array.isArray(data)) {
        return data;
    }

    if (Array.isArray(data?.articles)) {
        return data.articles;
    }

    if (Array.isArray(data?.data)) {
        return data.data;
    }

    return [];
}


async function loadArticle() {

    const container =
        document.getElementById(
            "articleContainer"
        );


    try {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const requestedId =
            params.get("id");


        if (!requestedId) {

            throw new Error(
                "شناسه مقاله مشخص نشده است."
            );

        }


        const response =
            await fetch(
                ARTICLE_PATH,
                {
                    cache:"no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "فایل articles.json پیدا نشد."
            );

        }


        const data =
            await response.json();


        const articles =
            toArray(data);


        const article =
            articles.find(
                item =>
                    String(item.id) ===
                    String(requestedId)
            );


        if (!article) {

            throw new Error(
                "مقاله موردنظر پیدا نشد."
            );

        }


        document.title =
            `${article.title || "خبر"} | GAMEHUB`;


        let contentHTML = "";


        if (Array.isArray(article.content)) {

            contentHTML =
                article.content
                    .map(
                        paragraph =>
                            `<p>${escapeHTML(
                                paragraph
                            )}</p>`
                    )
                    .join("");

        }

        else if (
            typeof article.content ===
            "string"
        ) {

            contentHTML =
                article.content
                    .split("\n")
                    .filter(Boolean)
                    .map(
                        paragraph =>
                            `<p>${escapeHTML(
                                paragraph
                            )}</p>`
                    )
                    .join("");

        }


        if (!contentHTML) {

            contentHTML = `
                <p>
                    محتوای کامل این مقاله هنوز اضافه نشده است.
                </p>
            `;

        }


        container.innerHTML = `

            <article class="article">

                ${
                    article.image
                    ?
                    `
                    <img
                        class="article-image"
                        src="${escapeHTML(article.image)}"
                        alt="${escapeHTML(article.title)}"
                    >
                    `
                    :
                    ""
                }


                <div class="article-content">


                    ${
                        article.category
                        ?
                        `
                        <span class="category">
                            ${escapeHTML(
                                article.category
                            )}
                        </span>
                        `
                        :
                        ""
                    }


                    ${
                        article.gameName
                        ?
                        `
                        <div class="game">
                            🎮 ${escapeHTML(
                                article.gameName
                            )}
                        </div>
                        `
                        :
                        ""
                    }


                    <h1>
                        ${escapeHTML(
                            article.title ||
                            "بدون عنوان"
                        )}
                    </h1>


                    ${
                        article.description
                        ?
                        `
                        <div class="description">
                            ${escapeHTML(
                                article.description
                            )}
                        </div>
                        `
                        :
                        ""
                    }


                    <div class="meta">

                        ${
                            article.author
                            ?
                            `
                            <span>
                                ✍️ ${escapeHTML(
                                    article.author
                                )}
                            </span>
                            `
                            :
                            ""
                        }


                        ${
                            article.date
                            ?
                            `
                            <span>
                                📅 ${escapeHTML(
                                    article.date
                                )}
                            </span>
                            `
                            :
                            ""
                        }


                        ${
                            article.time
                            ?
                            `
                            <span>
                                🕒 ${escapeHTML(
                                    article.time
                                )}
                            </span>
                            `
                            :
                            ""
                        }


                        ${
                            article.readTime
                            ?
                            `
                            <span>
                                📖 ${escapeHTML(
                                    article.readTime
                                )}
                            </span>
                            `
                            :
                            ""
                        }

                    </div>


                    <div class="content">
                        ${contentHTML}
                    </div>


                    ${
                        article.author
                        ?
                        `
                        <div class="author-box">

                            <div class="author-avatar">
                                ✍️
                            </div>

                            <div>

                                <div class="author-name">
                                    ${escapeHTML(
                                        article.author
                                    )}
                                </div>

                                <div class="author-label">
                                    نویسنده مقاله
                                </div>

                            </div>

                        </div>
                        `
                        :
                        ""
                    }

                </div>

            </article>

        `;


    } catch(error) {

        console.error(error);


        container.innerHTML = `

            <div class="error">

                <h2>
                    مقاله پیدا نشد
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>


                <a
                    href="index.html"
                    class="home-btn"
                >
                    بازگشت به صفحه اصلی
                </a>

            </div>

        `;

    }

}


loadArticle();

</script>

</body>
</html>
